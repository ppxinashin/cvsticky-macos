name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build Apple Silicon app
        run: scripts/build-app.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/CVSticky-macOS-arm64.zip --generate-notes --title "CVSticky $GITHUB_REF_NAME"
